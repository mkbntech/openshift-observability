server.port=8080
spring.application.name=order-service

# Minimal H2 In-Memory Database configuration
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Downstream endpoint for Python FastAPI Inventory Service
inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service:8000/reserve}

# Actuator & Prometheus Metrics exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
