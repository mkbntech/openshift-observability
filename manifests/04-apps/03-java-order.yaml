apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: observability-demo
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        # Red Hat OpenTelemetry Operator Java Auto-Instrumentation
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: order-service
          image: image-registry.openshift-image-registry.svc:5000/observability-demo/order-java:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8000/reserve"
            - name: OTEL_SERVICE_NAME
              value: "order-service"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:MaxRAMPercentage=75"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: observability-demo
  labels:
    app: order-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: order-service
