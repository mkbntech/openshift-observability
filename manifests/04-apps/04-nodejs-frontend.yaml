apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: observability-demo
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        # Red Hat OpenTelemetry Operator Node.js Auto-Instrumentation
        instrumentation.opentelemetry.io/inject-nodejs: "true"
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/observability-demo/frontend-node:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8080/orders"
            - name: REQUEST_TIMEOUT_MS
              value: "3000"
            - name: OTEL_SERVICE_NAME
              value: "frontend-node"
            - name: JAEGER_UI_URL
              value: "https://tempo-tempo-query-frontend-tracing.apps-crc.testing"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: observability-demo
  labels:
    app: frontend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: frontend
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: observability-demo
  labels:
    app: frontend
spec:
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
