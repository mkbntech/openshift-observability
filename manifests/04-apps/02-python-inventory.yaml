apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: observability-demo
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
      annotations:
        # Red Hat OpenTelemetry Operator Python Auto-Instrumentation
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: inventory-service
          image: image-registry.openshift-image-registry.svc:5000/observability-demo/inventory-python:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WORKER_SERVICE_URL
              value: "http://worker-service:8090/process"
            - name: OTEL_SERVICE_NAME
              value: "inventory-service"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: observability-demo
  labels:
    app: inventory-service
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: inventory-service
