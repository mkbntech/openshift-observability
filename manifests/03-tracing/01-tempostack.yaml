apiVersion: tempo.grafana.com/v1alpha1
kind: TempoStack
metadata:
  name: tempo
  namespace: tracing
spec:
  storageSize: 1Gi
  storage:
    secret:
      name: tempo-s3-secret
      type: s3
  resources:
    total:
      limits:
        memory: 2Gi
        cpu: 2000m
      requests:
        memory: 512Mi
        cpu: 200m
  template:
    queryFrontend:
      component:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      jaegerQuery:
        enabled: true
        authentication:
          enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        tempoQuery:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        ingress:
          type: route
          route:
            termination: edge
